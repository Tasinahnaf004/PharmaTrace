{% extends "base.html" %}
{% block content %}
<h2>All Registered Students</h2>
<table class="table table-striped table-hover mt-3">
    <thead class="table-dark">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Marks</th>
        </tr>
    </thead>
    <tbody>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.age }}</td>
            <td>{{ student.marks }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}

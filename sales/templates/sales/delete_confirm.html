{% extends 'base.html' %}
{% block content %}
<div class="card border-danger mx-auto mt-5 text-center" style="max-width: 450px;">
    <div class="card-body p-5">
        <i class="fas fa-exclamation-triangle text-danger mb-3" style="font-size: 3rem;"></i>
        <h3 class="fw-bold">Delete {{ obj.name }}?</h3>
        <p class="text-muted">This action will remove all associated medical data permanently.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-5">Confirm Delete</button>
            <a href="/" class="btn btn-light px-5">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

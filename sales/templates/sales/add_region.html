{% extends 'base.html' %}
{% block content %}
<div class="card mx-auto mt-5" style="max-width: 500px;">
    <div class="card-body p-4">
        <h3 class="fw-bold mb-4">{{ title }}</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Save Changes</button>
            <a href="/" class="btn btn-link w-100 mt-2 text-decoration-none text-muted">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

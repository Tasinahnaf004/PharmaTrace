{% extends "base.html" %}
{% block content %}
<h2>Search Records</h2>
<form action="/search" method="GET" class="d-flex mb-4">
    <input type="text" name="query" class="form-control me-2" placeholder="Enter student name...">
    <button type="submit" class="btn btn-success">Search</button>
</form>

{% if results %}
    <h3>Search Results:</h3>
    <ul class="list-group">
        {% for s in results %}
            <li class="list-group-item">
                <strong>{{ s.name }}</strong> - Age: {{ s.age }}, Marks: {{ s.marks }}
            </li>
        {% endfor %}
    </ul>
{% endif %}
{% endblock %}
